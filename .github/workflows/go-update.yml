name: Open Go Update PR

on:
  workflow_dispatch:
    inputs:
      go_version:
        description: 'Go version'
        required: true
        type: string
      open_pr:
        description: 'Whether to open a PR'
        required: false
        type: boolean
        default: true
      draft:
        description: 'Open a Draft PR'
        required: false
        type: boolean
        default: false
      branch:
        description: 'Git branch to use (defaults to "gobot/go-update-<go_version>")'
        required: false
        type: string
        default: ''

permissions: {}

env:
  BRANCH_NAME: ${{ inputs.branch || format('gobot/go-update-{0}', inputs.go_version) }}

jobs:
  open-go-update-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push commit and branch
      id-token: write # needed for dd-octo-sts token exchange

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python and pip
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Get access token via dd-octo-sts
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/datadog-agent-buildimages
          policy: self.go-update.create-pr

      - name: Get access token for DataDog/images
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts-images
        with:
          scope: DataDog/images
          policy: datadog-agent-buildimages.go-update.update-mirror

      - name: Check golang image is mirrored and open PR if not
        env:
          IMAGES_TOKEN: ${{ steps.octo-sts-images.outputs.token }}
          GO_VERSION: ${{ inputs.go_version }}
        run: |
          if GH_TOKEN=$IMAGES_TOKEN gh api repos/DataDog/images/contents/mirror.yaml \
              --jq '.content' | base64 -d | grep -q "golang:${GO_VERSION}@sha256:"; then
            echo "golang:${GO_VERSION} is already in mirror.yaml"
          else
            DIGEST=$(docker buildx imagetools inspect "docker.io/library/golang:${GO_VERSION}" \
              --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest')
            if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
              echo "golang:${GO_VERSION} is not on Docker Hub yet."
              exit 1
            fi
            EXISTING_PR=$(GH_TOKEN=$IMAGES_TOKEN gh pr list \
              --repo DataDog/images \
              --head "mirror/golang-${GO_VERSION}" \
              --json url --jq '.[0].url' 2>/dev/null || true)
            if [ -n "$EXISTING_PR" ]; then
              echo "Images PR already exists: ${EXISTING_PR}. Wait for it to merge before re-running."
              exit 1
            fi
            git clone "https://x-access-token:${IMAGES_TOKEN}@github.com/DataDog/images.git" /tmp/images
            cd /tmp/images
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git checkout -b "mirror/golang-${GO_VERSION}"
            GO_VERSION="$GO_VERSION" DIGEST="$DIGEST" python3 "$GITHUB_WORKSPACE/.github/scripts/update_mirror.py"
            git add mirror.yaml mirror.lock.yaml
            git commit -m "Mirror library/golang ${GO_VERSION}"
            git push origin "mirror/golang-${GO_VERSION}"
            PR_URL=$(GH_TOKEN=$IMAGES_TOKEN gh pr create \
              --repo DataDog/images \
              --title "Mirror library/golang ${GO_VERSION}" \
              --body "## What does this PR do?
          Adds \`library/golang:${GO_VERSION}\` to the mirror list.

          ## Motivation
          Needed for the Go ${GO_VERSION} update of the Datadog Agent.

          ## Describe how you validated your changes
          Digest obtained via \`docker buildx imagetools inspect\`." \
              --base main \
              --head "mirror/golang-${GO_VERSION}")
            echo "Images PR opened: ${PR_URL}. Wait for it to merge before re-running."
            exit 1
          fi

      - name: Install dependencies
        run: |
          DDA_VERSION=$(grep DDA_VERSION dda.env | awk -F= '/^DDA_VERSION=/ {print $2}')
          python3 -m pip install "git+https://github.com/DataDog/datadog-agent-dev.git@${DDA_VERSION}"
          python3 -m dda -v self dep sync -f legacy-build

      - name: Update Go version
        run: |
          dda run update go "${{ inputs.go_version }}" --check-archive

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ inputs.open_pr }}
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          commit-message: "[push_to_datadog_agent] Update go version to ${{ inputs.go_version }}"
          branch: ${{ env.BRANCH_NAME }}
          sign-commits: true
          title: "Update Go version to ${{ inputs.go_version }}"
          body: |
              ## Update docker images to Go ${{ inputs.go_version }}
              For more information about this version, see the [Go release notes](https://golang.org/doc/devel/release.html#go${{ inputs.go_version }}) and the [Github milestone](https://github.com/golang/go/issues?q=milestone%3AGo${{ inputs.go_version }}+label%3ACherryPickApproved)
          draft: ${{ inputs.draft }}
