name: Open Go Update PR

# TODO: append "on ${{ inputs.target_branches }}" once target_branches input is added
run-name: "Open Go ${{ inputs.go_version }} Update PR"

on:
  workflow_dispatch:
    inputs:
      go_version:
        description: 'Go version (format X.Y.Z, e.g. 1.27.0)'
        required: true
        type: string
      # TODO: uncomment when multi-branch support is implemented
      # target_branches:
      #   description: 'Branches to update, e.g. "main, 7.83.x, 7.82.x"'
      #   required: true
      #   type: string
      open_pr:
        description: 'Whether to open a PR'
        required: false
        type: boolean
        default: true
      draft:
        description: 'Open a Draft PR'
        required: false
        type: boolean
        default: false
      branch:
        description: 'Git branch to use (defaults to "gobot/go-update-<go_version>")'
        required: false
        type: string
        default: ''

permissions: {}

env:
  BRANCH_NAME: ${{ inputs.branch || format('gobot/go-update-{0}', inputs.go_version) }}

jobs:
  open-go-update-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push commit and branch
      id-token: write # needed for dd-octo-sts token exchange

    steps:
      - name: Validate go_version
        run: |
          if [[ ! "${{ inputs.go_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::go_version must be X.Y.Z (e.g. 1.27.0). Got: '${{ inputs.go_version }}'"
            exit 1
          fi

      - name: Check MsGo has published the release
        run: |
          RESPONSE=$(curl -sL "https://aka.ms/golang/release/latest/go${{ inputs.go_version }}-1.linux-amd64.tar.gz.sha256")
          if ! echo "$RESPONSE" | grep -qE '^[0-9a-f]{64}'; then
            echo "MsGo has not published go${{ inputs.go_version }} yet. Check: https://github.com/microsoft/go/releases"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python and pip
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Get access token via dd-octo-sts
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/datadog-agent-buildimages
          policy: self.go-update.create-pr

      - name: Install dependencies
        run: |
          DDA_VERSION=$(grep DDA_VERSION dda.env | awk -F= '/^DDA_VERSION=/ {print $2}')
          python3 -m pip install "git+https://github.com/DataDog/datadog-agent-dev.git@${DDA_VERSION}"
          python3 -m dda -v self dep sync -f legacy-build

      - name: Update Go version
        run: |
          dda run update go "${{ inputs.go_version }}" --check-archive

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ inputs.open_pr }}
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          commit-message: "Update Go version to ${{ inputs.go_version }}"
          branch: ${{ env.BRANCH_NAME }}
          sign-commits: true
          title: "Update Go version to ${{ inputs.go_version }}"
          body: |
              ## Update docker images to Go ${{ inputs.go_version }}
              For more information about this version, see the [Go release notes](https://golang.org/doc/devel/release.html#go${{ inputs.go_version }}) and the [Github milestone](https://github.com/golang/go/issues?q=milestone%3AGo${{ inputs.go_version }}+label%3ACherryPickApproved)
          draft: ${{ inputs.draft }}
