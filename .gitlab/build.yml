---
.x64:
  tags: ["arch:amd64"]
  image: $BUILDENV_REGISTRY/images/docker:27.3.1
  variables:
    ARCH: x86_64
    DD_TARGET_ARCH: x64
    PLATFORM: linux/amd64

.arm:
  tags: ["arch:arm64"]
  image: $BUILDENV_REGISTRY/images/docker:27.3.1
  variables:
    ARCH: aarch64
    DD_TARGET_ARCH: aarch64
    PLATFORM: linux/arm64

.no_schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

.build:
  stage: build
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
    # Used by send-metrics.sh to mint a short-lived Datadog API key via dd-sts
    DD_STS_OIDC_TOKEN:
      aud: dd-sts
  before_script:
    # Install the vault CLI, pinned to the same version and checksums as docker-bake.hcl.
    # NOTE: keep the version in sync with VAULT_VERSION in docker-bake.hcl.
    - VAULT_ARCH="amd64"; VAULT_SHA256="a0c0449e640c8be5dcf7b7b093d5884f6a85406dbb86bbad0ea06becad5aaab8"
    - if [[ "$ARCH" == "aarch64" ]]; then VAULT_ARCH="arm64"; VAULT_SHA256="1cdfd33e218ef145dbc3d71ac4164b89e453ff81b780ed178274bc1ba070e6e9"; fi
    - VAULT_FILENAME="vault_1.17.2_linux_${VAULT_ARCH}.zip"
    - curl --retry 10 -fsSLO "https://releases.hashicorp.com/vault/1.17.2/${VAULT_FILENAME}"
    - echo "${VAULT_SHA256} ${VAULT_FILENAME}" | sha256sum --check
    - unzip -o "${VAULT_FILENAME}" -d /usr/bin vault
    - rm "${VAULT_FILENAME}"
    # Install the dd-sts CLI, pinned. Used by send-metrics.sh to exchange the
    # job's OIDC ID token for a short-lived Datadog API key.
    # See the dd-sts user guide:
    # https://datadoghq.atlassian.net/wiki/spaces/SECENG/pages/5769659435/User+guide+dd-sts
    - curl --retry 10 -fsSL -o /tmp/dd-sts-tar.tar.gz "https://binaries.ddbuild.io/dd-source/dd-sts/v0.1.6/dd-sts-tar.tar.gz"
    - echo "0992b5a8eefb13a9b382a6b328953c33aa999e5b009ecb1bbc591af11a003cfb  /tmp/dd-sts-tar.tar.gz" | sha256sum --check
    - tar -xzf /tmp/dd-sts-tar.tar.gz -C /tmp
    - install -m 0755 "/tmp/dd-sts-linux-${VAULT_ARCH}" /usr/local/bin/dd-sts
    - rm -rf /tmp/dd-sts-tar.tar.gz /tmp/dd-sts-darwin-* /tmp/dd-sts-linux-*
    # Docker Hub login to reduce risk of rate limiting.
    # Credentials are read from Vault; the runner provides Vault
    # authentication and POD_NAMESPACE.
    - DOCKER_REGISTRY_LOGIN=$(vault kv get -field=login kv/k8s/${POD_NAMESPACE}/datadog-agent-buildimages/dockerhub)
    - vault kv get -field=password kv/k8s/${POD_NAMESPACE}/datadog-agent-buildimages/dockerhub | docker login --username "$DOCKER_REGISTRY_LOGIN" --password-stdin docker.io
  script:
    - dd-sts debug
    - dd-sts exchange --policy datadog-agent-buildimages-metrics.yml -- bash -c 'ls'
    - ./build.sh
  retry: 1 # Add a retry to prevent flakyness on build stage.

# Default timeout of 2h is too long for build stage, we want to fail faster if it's hanging
# Due to an upstream buildx issue (https://github.com/docker/buildx/issues/556), when the remote build container is killed, the command does not fail but instead hangs indefinitely.
# Timeout values were chosen to be just above the longest historically-available runtime of the corresponding job's successful runs
.fast_build:
  extends: .build
  timeout: 30m

.medium_build:
  extends: .build
  timeout: 45m

.build_bake:
  stage: build
  timeout: 2h
  before_script:
    - !reference [.build, before_script]
  variables:
    IMAGE: linux
    IMAGE_VERSION_ROOT: v$CI_PIPELINE_ID-${CI_COMMIT_SHORT_SHA}
  script:
    - |
      PUSH=""
      if [[ "$CI_PIPELINE_SOURCE" != "schedule" ]]; then
        PUSH="--push"
      fi
    - docker buildx bake $PUSH ${PREVENT_CACHE:+--no-cache} $BAKE_TARGET
    - |
      if [[ "$CI_PIPELINE_SOURCE" != "schedule" ]]; then
        ./verify-image-layers.sh registry.ddbuild.io/ci/datadog-agent-buildimages/$IMAGE${ECR_TEST_ONLY}:$IMAGE_VERSION
        crane manifest registry.ddbuild.io/ci/datadog-agent-buildimages/$IMAGE${ECR_TEST_ONLY}:$IMAGE_VERSION | jq
        crane config registry.ddbuild.io/ci/datadog-agent-buildimages/$IMAGE${ECR_TEST_ONLY}:$IMAGE_VERSION | jq
        export SIZE=$(crane manifest registry.ddbuild.io/ci/datadog-agent-buildimages/$IMAGE${ECR_TEST_ONLY}:$IMAGE_VERSION | jq '.config.size + ([.layers[].size] | add)')
        ./send-metrics.sh $IMAGE $SIZE $CI_COMMIT_REF_NAME
      fi

build_linux_amd64:
  extends: [.build_bake, .x64]
  needs:
    - job: build_toolchain_x86_64_native
      artifacts: false
    - job: build_toolchain_x86_64_cross_aarch64
      artifacts: false
  variables:
    IMAGE_VERSION: $IMAGE_VERSION_ROOT-amd64
    BAKE_TARGET: linux-amd64-ci$ECR_TEST_ONLY

build_rpm_x64:
  extends: [.medium_build, .x64]
  variables:
    DOCKERFILE: rpm-x64/Dockerfile
    IMAGE: rpm_x64
    BASE_IMAGE: centos:7

build_dd_agent_testing:
  extends: [.fast_build, .x64]
  variables:
    DOCKERFILE: dd-agent-testing/Dockerfile
    IMAGE: dd-agent-testing

build_docker_x64:
  extends: [.build_bake, .x64]
  timeout: 30m
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  variables:
    IMAGE: docker_x64
    IMAGE_VERSION: $IMAGE_VERSION_ROOT
    BAKE_TARGET: docker_x64-ci$ECR_TEST_ONLY
  script:
    - !reference [.build_bake, script]
    - |
      if [[ "$CI_PIPELINE_SOURCE" != "schedule" ]]; then
        MANIFEST=$(crane manifest registry.ddbuild.io/ci/datadog-agent-buildimages/${IMAGE}${ECR_TEST_ONLY}:${IMAGE_VERSION})
        DIGEST=sha256:$(echo -n "$MANIFEST" | sha256sum | awk '{print $1}')
        ddsign sign registry.ddbuild.io/ci/datadog-agent-buildimages/${IMAGE}${ECR_TEST_ONLY}:${IMAGE_VERSION}@${DIGEST}
      fi

build_btf_gen:
  extends: [.fast_build, .x64]
  variables:
    DOCKERFILE: btf-gen/Dockerfile
    IMAGE: btf-gen

build_gitlab_agent_deploy:
  extends: [.fast_build, .x64]
  variables:
    DOCKERFILE: agent-deploy/Dockerfile
    IMAGE: gitlab_agent_deploy

build_linux_arm64:
  extends: [.build_bake, .arm]
  needs:
    - job: build_toolchain_aarch64_native
      artifacts: false
    - job: build_toolchain_aarch64_cross_x86_64
      artifacts: false
  variables:
    IMAGE_VERSION: $IMAGE_VERSION_ROOT-arm64
    BAKE_TARGET: linux-arm64-ci$ECR_TEST_ONLY

build_rpm_arm64:
  extends: [.medium_build, .arm]
  variables:
    DOCKERFILE: rpm-arm64/Dockerfile
    IMAGE: rpm_arm64
    BASE_IMAGE: amazonlinux:2.0.20181114

build_rpm_armhf:
  extends: [.medium_build, .arm]
  variables:
    DOCKERFILE: rpm-armhf/Dockerfile
    IMAGE: rpm_armhf
    BASE_IMAGE: arm32v7/centos:7
    DD_TARGET_ARCH: armhf

build_docker_arm64:
  extends: [.fast_build, .arm]
  variables:
    DOCKERFILE: docker-arm64/Dockerfile
    IMAGE: docker_arm64

.build_multiarch:
  extends: [.no_schedule, .x64]
  stage: build
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  before_script:
    - !reference [.build, before_script]
  script:
    - >
      docker manifest create $TARGET_IMAGE:$IMAGE_VERSION
      $TARGET_IMAGE:$IMAGE_VERSION-amd64
      $TARGET_IMAGE:$IMAGE_VERSION-arm64
    - MANIFEST=$(docker manifest inspect $TARGET_IMAGE:$IMAGE_VERSION)
    - DIGEST=sha256:$(echo -n "$MANIFEST" | sha256sum | awk '{print $1}')
    - docker manifest push $TARGET_IMAGE:$IMAGE_VERSION
    - ddsign sign $TARGET_IMAGE:$IMAGE_VERSION@${DIGEST}

build_multiarch_linux:
  extends: [.build_multiarch]
  needs:
    - job: build_linux_amd64
    - job: build_linux_arm64
  variables:
    TARGET_IMAGE: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$ECR_TEST_ONLY

build_multiarch_devenv_workspace:
  extends: [.build_multiarch]
  needs:
    - job: build_dev_env_workspace_x64
    - job: build_dev_env_workspace_arm64
  variables:
    TARGET_IMAGE: registry.ddbuild.io/ci/datadog-agent-buildimages/dev-env-workspace$ECR_TEST_ONLY
  script:
    - >
      docker manifest create $TARGET_IMAGE:$IMAGE_VERSION
      registry.ddbuild.io/ci/datadog-agent-buildimages/dev-env-workspace-amd64$ECR_TEST_ONLY:$IMAGE_VERSION
      registry.ddbuild.io/ci/datadog-agent-buildimages/dev-env-workspace-arm64$ECR_TEST_ONLY:$IMAGE_VERSION
    - MANIFEST=$(docker manifest inspect $TARGET_IMAGE:$IMAGE_VERSION)
    - DIGEST=sha256:$(echo -n "$MANIFEST" | sha256sum | awk '{print $1}')
    - docker manifest push $TARGET_IMAGE:$IMAGE_VERSION
    - ddsign sign $TARGET_IMAGE:$IMAGE_VERSION@${DIGEST}

build_dev_env_linux_x64:
  extends: [.fast_build, .no_schedule, .x64]
  needs:
    - job: build_linux_amd64
  variables:
    DOCKERFILE: dev-envs/linux/Dockerfile
    IMAGE: dev-env-linux-$DD_TARGET_ARCH
    BASE_IMAGE: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$ECR_TEST_ONLY
    BASE_IMAGE_TAG: $IMAGE_VERSION-amd64

build_dev_env_linux_arm64:
  extends: [.fast_build, .no_schedule, .arm]
  needs:
    - job: build_linux_arm64
  variables:
    DOCKERFILE: dev-envs/linux/Dockerfile
    IMAGE: dev-env-linux-$DD_TARGET_ARCH
    BASE_IMAGE: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$ECR_TEST_ONLY
    BASE_IMAGE_TAG: $IMAGE_VERSION-arm64

build_dev_env_workspace_x64:
  extends: [.fast_build, .no_schedule, .x64]
  needs:
    - job: build_linux_amd64
  variables:
    DOCKERFILE: dev-envs/linux/Dockerfile
    IMAGE: dev-env-workspace-amd64
    BASE_IMAGE: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$ECR_TEST_ONLY
    BASE_IMAGE_TAG: $IMAGE_VERSION-amd64
    IMAGE_VARIANT: workspace

build_dev_env_workspace_arm64:
  extends: [.fast_build, .no_schedule, .arm]
  needs:
    - job: build_linux_arm64
  variables:
    DOCKERFILE: dev-envs/linux/Dockerfile
    IMAGE: dev-env-workspace-arm64
    BASE_IMAGE: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$ECR_TEST_ONLY
    BASE_IMAGE_TAG: $IMAGE_VERSION-arm64
    IMAGE_VARIANT: workspace

.build_windows_x64:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - changes:
        paths:
          - build-container.ps1
          - windows/**/*
          - go.env
          - .gitlab/build.yml
        compare_to: $COMPARE_TO_BRANCH
  timeout: 2h 30m
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  variables:
    DOCKERFILE: windows/Dockerfile
    DD_TARGET_ARCH: x64
    CI_IDENTITIES_GITLAB_JOB_CLIENT_VERSION: v0.6.4 # version and digest must be updated in windows/versions.ps1 as well
    BASE_IMAGE_REGISTRY: registry.ddbuild.io/images/mirror
  script:
    - aws s3 cp --only-show-errors s3://binaries-ddbuild-io-prod/ci-identities/ci-identities-gitlab-job-client/versions/$CI_IDENTITIES_GITLAB_JOB_CLIENT_VERSION/ci-identities-gitlab-job-client-windows-amd64.exe .
    - $OUTPUT_IMAGE = "registry.ddbuild.io/ci/datadog-agent-buildimages/${IMAGE}${ECR_TEST_ONLY}"
    - .\build-container.ps1 -Image $OUTPUT_IMAGE -Tag $IMAGE_VERSION -BaseImageRegistry $BASE_IMAGE_REGISTRY -BaseImageTag $BASE_IMAGE_TAG -Buildkit
    - New-Item -ItemType File -Path "windows.image" -Force # Create a file to indicate that the image is built
  artifacts:
    paths: ["./windows.image"]
    expire_in: 1 day

build_windows_ltsc2022_x64:
  extends: [.build_windows_x64]
  tags: ["windows-v2:2022"]
  variables:
    BASE_IMAGE_TAG: 4.8-windowsservercore-ltsc2022
    IMAGE: windows_ltsc2022_x64
    WINDOWS_VERSION: 2022

build_windows_ltsc2025_x64:
  extends: [.build_windows_x64]
  tags: ["windows-v2:2025"]
  variables:
    BASE_IMAGE_TAG: 4.8.1-windowsservercore-ltsc2025
    IMAGE: windows_ltsc2025_x64
    WINDOWS_VERSION: 2025
