---
trigger_tests:
  stage: test
  # Windows images (build_windows_ltsc2022_x64/2025_x64) are only rebuilt when
  # windows-related files change (see .build_windows_x64 rules in build.yml) or
  # on the default branch. Only point datadog-agent at this pipeline's windows
  # test images when they were actually built, otherwise fall back to
  # datadog-agent's own defaults.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
      variables:
        CI_IMAGE_WIN_LTSC2022_X64: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
        CI_IMAGE_WIN_LTSC2022_X64_SUFFIX: "${ECR_TEST_ONLY}"
        CI_IMAGE_WIN_LTSC2025_X64: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
        CI_IMAGE_WIN_LTSC2025_X64_SUFFIX: "${ECR_TEST_ONLY}"
    - changes:
        paths:
          - build-container.ps1
          - windows/**/*
          - go.env
          - .gitlab/build.yml
        compare_to: $COMPARE_TO_BRANCH
      when: manual
      allow_failure: true
      variables:
        CI_IMAGE_WIN_LTSC2022_X64: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
        CI_IMAGE_WIN_LTSC2022_X64_SUFFIX: "${ECR_TEST_ONLY}"
        CI_IMAGE_WIN_LTSC2025_X64: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
        CI_IMAGE_WIN_LTSC2025_X64_SUFFIX: "${ECR_TEST_ONLY}"
    - when: manual
      allow_failure: true
  variables:
    RUN_KITCHEN_TESTS: "false"
    BUCKET_BRANCH: "dev"
    CI_IMAGE_BTF_GEN: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    CI_IMAGE_BTF_GEN_SUFFIX: "${ECR_TEST_ONLY}"
    CI_IMAGE_DOCKER_X64: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    CI_IMAGE_DOCKER_X64_SUFFIX: "${ECR_TEST_ONLY}"
    CI_IMAGE_DOCKER_ARM64: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    CI_IMAGE_DOCKER_ARM64_SUFFIX: "${ECR_TEST_ONLY}"
    CI_IMAGE_GITLAB_AGENT_DEPLOY: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    CI_IMAGE_GITLAB_AGENT_DEPLOY_SUFFIX: "${ECR_TEST_ONLY}"
    CI_IMAGE_LINUX: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    CI_IMAGE_LINUX_SUFFIX: "${ECR_TEST_ONLY}"
    CI_IMAGE_RPM_X64: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    CI_IMAGE_RPM_X64_SUFFIX: "${ECR_TEST_ONLY}"
    CI_IMAGE_RPM_ARM64: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    CI_IMAGE_RPM_ARM64_SUFFIX: "${ECR_TEST_ONLY}"
    CI_IMAGE_RPM_ARMHF: "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    CI_IMAGE_RPM_ARMHF_SUFFIX: "${ECR_TEST_ONLY}"
  trigger:
    project: DataDog/datadog-agent
    strategy: depend

push_to_datadog_agent_post_merge:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_MESSAGE !~ /^\[push_to_datadog_agent\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_BRANCH =~ /^[0-9]+\.[0-9]+\.x$/
      when: always
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$ECR_TEST_ONLY:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}
  dependencies: []
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  before_script:
    - dd-octo-sts version
    - dd-octo-sts token --scope DataDog/datadog-agent --policy self.buildimages-ci.push-to-datadog-agent > token.txt
  script:
    - source /root/.bashrc
    - set -o pipefail
    - >
      for line in $(cat go.env); do
        export $line
      done
    - export DDA_VERSION=$(grep DDA_VERSION dda.env | awk -F= '/^DDA_VERSION=/ {print $2}')
    - pip install "dda==${DDA_VERSION}"
    - dda -v self dep sync -f legacy-build
    - export GITHUB_TOKEN=$(cat token.txt)
    - BRANCH=$(printf '%s' "$CI_COMMIT_MESSAGE" | grep -oP '(?<=\[da-branch:)[^\]]+' | head -1)
    - dda run update agent-build-images "v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}" "$BRANCH" --ref "$CI_COMMIT_BRANCH"
  after_script:
    - dd-octo-sts revoke -t $(cat token.txt)

# Creates a draft PR in datadog-agent with test-only image tags before buildimages merges.
# Particularly useful for minor Go updates which take longer to merge.
push_to_datadog_agent:
  stage: test
  rules:
    - if: $CI_COMMIT_MESSAGE !~ /^\[push_to_datadog_agent\]/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - !reference [.on_push]
  tags: ["arch:amd64"]
  # TODO: This is not great, we probably should not rely on _test_only images but as we don't push a `latest` tag for validated images we don't really have a choice.
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$ECR_TEST_ONLY:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}
  dependencies: [] # do not download artifacts from other jobs
  needs: [build_multiarch_linux] # wait for the multiarch image to be built as it is used for this job's execution environment
  variables:
    REF: main
    BRANCH: buildimages/$CI_COMMIT_BRANCH
    IMAGES_ID: v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  before_script:
    # Get a restricted-permissions token for datadog-agent repository
    - dd-octo-sts version
    - dd-octo-sts token --scope DataDog/datadog-agent --policy self.buildimages-ci.push-to-datadog-agent > token.txt
  script:
    - source /root/.bashrc
    - set -o pipefail
    # Get the current go version from the go.env file
    - >
      for line in $(cat go.env); do
        export $line
      done
    - export DDA_VERSION=$(grep DDA_VERSION dda.env | awk -F= '/^DDA_VERSION=/ {print $2}')
    - pip install "dda==${DDA_VERSION}"
    - dda -v self dep sync -f legacy-build
    - export GITHUB_TOKEN=$(cat token.txt)
    - dda run update agent-build-images "$IMAGES_ID" "$BRANCH" --ref "$REF" --test-version
  after_script:
    # Revoke the token after usage
    - dd-octo-sts revoke -t $(cat token.txt)
