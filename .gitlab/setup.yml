---
get_agent_version:
  stage: setup
  tags: ["arch:amd64"]
  image: $BUILDENV_REGISTRY/images/python:3.12.8
  script:
    - export DDA_VERSION=$(grep DDA_VERSION dda.env | awk -F= '/^DDA_VERSION=/ {print $2}')
    - pip install "dda==${DDA_VERSION}"
    - export PATH=/home/dog/.local/bin:$PATH
    - VERSION=$(dda run agent version)
    - echo "AGENT_VERSION=$VERSION"
    - echo "AGENT_VERSION=$VERSION" >> version.env
  artifacts:
    reports:
      dotenv: version.env

lint_dockerfiles:
  tags: ["arch:amd64"]
  stage: setup
  needs: []
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/images:v26997867-ebc48a76
  script:
    - hadolint dev-envs/linux/Dockerfile

validate_tools:
  stage: setup
  tags: ["arch:amd64"]
  image: $BUILDENV_REGISTRY/images/python:3.12.8
  script:
    - export DDA_VERSION=$(grep DDA_VERSION dda.env | awk -F= '/^DDA_VERSION=/ {print $2}')
    - |
      for name_url in \
        "rg=https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz" \
        "ya=https://github.com/sxyazi/yazi/releases/download/v25.5.31/ya-x86_64-unknown-linux-musl.zip" \
        "hyperfine=https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine-v1.18.0-x86_64-unknown-linux-musl.tar.gz"; do
        name="${name_url%%=*}"
        url="${name_url#*=}"
        echo "=== $name ==="
        curl -sSL -D "/tmp/${name}.headers" -o "/tmp/${name}.bin" -w "HTTP_CODE=%{http_code} SIZE=%{size_download}\n" "$url" || echo "curl failed for $name"
        echo "--- headers (redacted) ---"
        grep -viE '^(set-cookie|authorization):' "/tmp/${name}.headers" | sed -E 's/^(location:[^?]*)\?.*/\1?[REDACTED]/i'
        echo "--- file info ---"
        file "/tmp/${name}.bin" || true
        echo "--- first 300 bytes ---"
        head -c 300 "/tmp/${name}.bin" | xxd | head -20 || true
        echo ""
      done
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install "dda==${DDA_VERSION}"
    - dda run tools check --integrity

build_linux_build_base_x64:
  extends: [.fast_build, .always, .x64]
  stage: toolchains
  variables:
    DOCKERFILE: linux-build-base/Dockerfile
    IMAGE: linux-build-base
    IMAGE_VERSION: "v$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA-amd64"

build_linux_build_base_arm64:
  extends: [.fast_build, .always, .arm]
  stage: toolchains
  variables:
    DOCKERFILE: linux-build-base/Dockerfile
    IMAGE: linux-build-base
    IMAGE_VERSION: "v$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA-arm64"
