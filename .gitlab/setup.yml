---
get_agent_version:
  stage: setup
  tags: ["arch:amd64"]
  image: $BUILDENV_REGISTRY/images/python:3.12.8
  script:
    - export DDA_VERSION=$(grep DDA_VERSION dda.env | awk -F= '/^DDA_VERSION=/ {print $2}')
    - pip install "dda==${DDA_VERSION}"
    - export PATH=/home/dog/.local/bin:$PATH
    - VERSION=$(dda run agent version)
    - echo "AGENT_VERSION=$VERSION"
    - echo "AGENT_VERSION=$VERSION" >> version.env
  artifacts:
    reports:
      dotenv: version.env

lint_dockerfiles:
  tags: ["arch:amd64"]
  stage: setup
  needs: []
  image: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/images:v26997867-ebc48a76
  script:
    - hadolint dev-envs/linux/Dockerfile

validate_tools:
  stage: setup
  tags: ["arch:amd64"]
  image: $BUILDENV_REGISTRY/images/python:3.12.8
  script:
    - export DDA_VERSION=$(grep DDA_VERSION dda.env | awk -F= '/^DDA_VERSION=/ {print $2}')
    - |
      python3 - <<'PYEOF'
      import urllib.request

      targets = [
          ("rg-1", "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz"),
          ("rg-2", "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz"),
          ("rg-3", "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz"),
          ("ya", "https://github.com/sxyazi/yazi/releases/download/v0.3.3/yazi-x86_64-unknown-linux-musl.zip"),
          ("hyperfine", "https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine-v1.18.0-x86_64-unknown-linux-musl.tar.gz"),
      ]
      REDACT_HEADERS = {"set-cookie", "authorization"}

      for name, url in targets:
          print(f"=== {name} ===")
          try:
              with urllib.request.urlopen(url) as resp:
                  status = resp.status
                  headers = resp.headers
                  body = resp.read()
          except Exception as e:
              print(f"urlopen failed: {e!r}")
              continue
          print(f"HTTP_CODE={status} SIZE={len(body)}")
          print("--- headers (redacted) ---")
          for k, v in headers.items():
              if k.lower() in REDACT_HEADERS:
                  continue
              if k.lower() == "location":
                  v = v.split("?")[0] + "?[REDACTED]"
              print(f"{k}: {v}")
          print("--- first 300 bytes (hex) ---")
          print(body[:300].hex())
          print()
      PYEOF
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install "dda==${DDA_VERSION}"
    - dda run tools check --integrity

build_linux_build_base_x64:
  extends: [.fast_build, .always, .x64]
  stage: toolchains
  variables:
    DOCKERFILE: linux-build-base/Dockerfile
    IMAGE: linux-build-base
    IMAGE_VERSION: "v$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA-amd64"

build_linux_build_base_arm64:
  extends: [.fast_build, .always, .arm]
  stage: toolchains
  variables:
    DOCKERFILE: linux-build-base/Dockerfile
    IMAGE: linux-build-base
    IMAGE_VERSION: "v$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA-arm64"
