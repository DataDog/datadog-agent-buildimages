---
lint_dockerfiles:
  tags: ["arch:amd64"]
  stage: setup
  needs: []
  image: registry.ddbuild.io/images/ci/images:v152562625-de9f215-1.2.10-buildx-0382@sha256:6047a1974404ea8bb5a2319eb84c4b3048306a4c1e386c0b58bfadef21d426e1
  script:
    - hadolint dev-envs/linux/Dockerfile

validate_tools:
  stage: setup
  tags: ["arch:amd64"]
  image: $BUILDENV_REGISTRY/images/python:3.12.8
  script:
    - export DDA_VERSION=$(grep DDA_VERSION dda.env | awk -F= '/^DDA_VERSION=/ {print $2}')
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install "dda==${DDA_VERSION}"
    - dda run tools check --integrity
