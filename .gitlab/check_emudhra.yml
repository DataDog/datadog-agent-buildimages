---
# TEMPORARY: check that every image rejects the compromised eMudhra chains.
check_emudhra_linux:
  stage: test
  tags: ["arch:$ARCH"]
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/${IMAGE_NAME}${ECR_TEST_ONLY}:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}${TAG_SUFFIX}
  dependencies: []
  needs:
    - job: build_multiarch_linux
    - job: build_toolchain_build_image_x64
    - job: build_toolchain_build_image_arm64
    - job: build_rpm_x64
    - job: build_rpm_arm64
    - job: build_rpm_armhf
    - job: build_dd_agent_testing
    - job: build_docker_x64
    - job: build_docker_arm64
    - job: build_btf_gen
    - job: build_gitlab_agent_deploy
    - job: build_dev_env_linux_x64
    - job: build_dev_env_linux_arm64
    - job: build_dev_env_workspace_x64
    - job: build_dev_env_workspace_arm64
  script:
    - sh .gitlab/scripts/check-emudhra.sh
  parallel:
    matrix:
      - ARCH: amd64
        TAG_SUFFIX: -amd64
        IMAGE_NAME: [toolchain-builder]
      - ARCH: arm64
        TAG_SUFFIX: -arm64
        IMAGE_NAME: [toolchain-builder]
      - ARCH: amd64
        TAG_SUFFIX: ""
        IMAGE_NAME: [linux, rpm_x64, dd-agent-testing, docker_x64, btf-gen, gitlab_agent_deploy, dev-env-linux-x64, dev-env-workspace-amd64]
      - ARCH: arm64
        TAG_SUFFIX: ""
        IMAGE_NAME: [linux, rpm_arm64, rpm_armhf, docker_arm64, dev-env-linux-aarch64, dev-env-workspace-arm64]

.check_emudhra_windows:
  stage: test
  rules: !reference [.build_windows_x64, rules]
  dependencies: []
  script:
    - $IMAGE_REF = "registry.ddbuild.io/ci/datadog-agent-buildimages/${IMAGE}${ECR_TEST_ONLY}:v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    - docker pull $IMAGE_REF
    - docker run --rm -m 4096M -v "$(Get-Location):c:\mnt" -e AWS_NETWORKING=true $IMAGE_REF powershell.exe -File c:\mnt\.gitlab\scripts\check-emudhra.ps1
    - If ($lastExitCode -ne "0") { throw "eMudhra check returned $lastExitCode" }

check_emudhra_windows_ltsc2022_x64:
  extends: [.check_emudhra_windows]
  tags: ["windows-v2:2022"]
  needs: [build_windows_ltsc2022_x64]
  variables:
    IMAGE: windows_ltsc2022_x64

check_emudhra_windows_ltsc2025_x64:
  extends: [.check_emudhra_windows]
  tags: ["windows-v2:2025"]
  needs: [build_windows_ltsc2025_x64]
  variables:
    IMAGE: windows_ltsc2025_x64
